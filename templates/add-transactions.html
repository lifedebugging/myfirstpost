<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - FinTrack</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header>
            <nav>
                <div class="logo">FinTrack</div>
            </nav>
        </header>

        <main>
            <section class="add-transaction">
                <h2>Add New Transactions</h2>
                <form action="/add-transaction" method="POST">
                    <div class="form-group">
                        <label for="type">Transaction Type:</label>
                        <select id="type" name="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" required>
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class ="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select a category</option> <option value="food">Food</option>
                            <option value ="rent">Rent</option>
                            <option value="income">Income</option>
                            <option value="travel">Travel</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="education">Education</option>
                            <option value="other">Other</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Enter a brief description of the transaction"></textarea>
                    </div>

                    <button type="submit" class="btn">Add Transaction</button>
                </form>
                <form action="/dashboard" method="get">
                    <button type="submit">View Dashboard</button>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 FinTrack. All rights reserved</p>
        </footer>
    </body>
</html>
