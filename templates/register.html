<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - FinTrack</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header>
            <nav>
                <div class = "logo">FinTrack</div>
            </nav>
        </header>

        <main>
            <section class="register-section"> 
                <h2> Register </h2>
                <form action="/register" method="post">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for ="email">Email</label>
                        <input type ="email" id="email" name="email" required>
                    </div>

                    <button type="submit" class="btn">Register</button>
                </form>

                <p class="form-group"> Already have an account? <a href="/login">Login here</a></p>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 FinTrack. All rights reserved.</p>
            <p>Contact us at <a href="mailto:samarthd74704@gmail.com">Email Us</a></p>
        </footer>
    </body>

</html>
